<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Panzek Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
:root{
  --bg:#0e0e0d;
  --surface:#161614;
  --surface-2:#1f1f1c;
  --line:#282823;
  --line-strong:#3a3a33;
  --text:#f3f0e8;
  --muted:#918e84;
  --accent:#e0432a;
  --accent-hover:#c93720;
  --accent-ink:#ffffff;
  --font-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --font-body:"DM Sans",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit}
button{cursor:pointer;touch-action:manipulation}

/* Flat Architectural Topbar */
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--bg);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.topbar-inner{
  max-width:1360px;margin:0 auto;padding:12px 20px;
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;
}
.brand{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:0;color:var(--text);text-align:left}
.brand-mark-box{
  width:28px;height:28px;border-radius:4px;flex:none;display:grid;place-items:center;
  background:var(--accent);color:var(--accent-ink);font-family:var(--font-display);font-weight:800;font-size:15px;
}
.brand-name{font-family:var(--font-display);font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1}
.brand-name span{color:var(--accent)}
.brand-tag{display:block;font-family:var(--font-mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}

.search-wrap{position:relative;max-width:460px;width:100%;justify-self:center}
.search-wrap label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.search-wrap input{
  width:100%;height:38px;padding:0 12px 0 34px;border-radius:5px;outline:0;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--text);font-size:14px;
  transition:border-color .15s;
}
.search-wrap input::placeholder{color:#6f6c64}
.search-wrap input:focus{border-color:var(--accent);background:var(--surface-2)}

.top-actions{display:flex;align-items:center;gap:10px;justify-self:end}
.stat-chip{
  font-family:var(--font-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;
}
.sync-btn{
  min-height:34px;padding:0 12px;border-radius:5px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--text);font-size:12px;font-weight:600;white-space:nowrap;
  transition:border-color .15s,background .15s;
}
.sync-btn:hover:not(:disabled){border-color:var(--text);background:var(--surface-2)}
.sync-btn:disabled{opacity:.5;cursor:wait}
.sync-status{font-family:var(--font-mono);font-size:10px;color:var(--muted);white-space:nowrap}

body[data-view="watch"] .catalog-view{display:none}
body[data-view="catalog"] .watch-view{display:none}

/* ================= CATALOG VIEW ================= */
.catalog-view{
  max-width:1360px;margin:0 auto;padding:20px 20px 96px;
  display:flex;flex-direction:column;gap:28px;
}

/* Editorial Feature Strip (No blur-slop, no glow) */
.hero-card{
  display:grid;grid-template-columns:148px 1fr;gap:22px;align-items:center;
  padding-bottom:24px;border-bottom:1px solid var(--line);
}
.hero-card[hidden]{display:none}
.hero-poster{
  width:148px;aspect-ratio:3/4;border-radius:4px;object-fit:cover;
  background:var(--surface);border:1px solid var(--line-strong);display:block;
}
.hero-label{
  display:inline-block;margin-bottom:8px;
  font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);
}
.hero-info h1{
  font-family:var(--font-display);margin:0 0 8px;
  font-size:clamp(22px,3vw,34px);line-height:1.12;text-wrap:balance;
}
.hero-info p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.5;max-width:52ch;text-pretty:auto}
.hero-cta{
  min-height:42px;padding:0 20px;border:0;border-radius:5px;
  background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;
  display:inline-flex;align-items:center;gap:8px;transition:background .15s;
}
.hero-cta:hover{background:var(--accent-hover)}
.hero-cta:active{transform:scale(.98)}

.section-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding-bottom:10px;border-bottom:1px solid var(--line);
}
.section-head h2{font-family:var(--font-display);margin:0;font-size:18px;font-weight:700}
.section-head span{font-family:var(--font-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Cardless Poster Grid (MUBI / Film Archive style) */
.catalog-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:20px 14px;
  margin-top:16px;
}
.drama-card{
  display:flex;flex-direction:column;gap:8px;padding:0;border:0;background:transparent;
  color:var(--text);text-align:left;
}
.drama-card:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.drama-thumb-box{
  position:relative;aspect-ratio:3/4;width:100%;border-radius:4px;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);
  transition:border-color .15s,transform .18s ease-out;
}
.drama-card:hover .drama-thumb-box{border-color:var(--line-strong);transform:translateY(-2px)}
.drama-card.active .drama-thumb-box{border-color:var(--accent);border-width:2px}
.drama-thumb-box img{width:100%;height:100%;object-fit:cover;display:block}
.drama-badge{
  position:absolute;top:0;left:0;z-index:2;display:none;
  padding:3px 8px;background:var(--accent);color:var(--accent-ink);
  font-family:var(--font-mono);font-size:10px;font-weight:700;text-transform:uppercase;
}
.drama-card.active .drama-badge{display:block}
.drama-meta{display:flex;flex-direction:column;gap:2px}
.drama-meta strong{
  font-size:13px;font-weight:600;line-height:1.32;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
}
.drama-card:hover .drama-meta strong{color:#fff}

.catalog-more{
  grid-column:1 / -1;justify-self:center;margin-top:8px;
  min-height:42px;padding:0 24px;border-radius:5px;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--text);
  font-size:13px;font-weight:600;
}
.catalog-more:hover{border-color:var(--text);background:var(--surface-2)}
.empty{grid-column:1 / -1;padding:32px 6px;color:var(--muted);font-size:14px}

/* Flat Bottom Continue Dock */
.mini-dock{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:var(--surface);border-top:1px solid var(--line-strong);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
.mini-dock[hidden]{display:none}
.mini-dock-inner{
  max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:12px;
}
.mini-dock img{width:34px;height:46px;border-radius:3px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line);flex:none}
.mini-dock-info{min-width:0;flex:1}
.mini-dock-info strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-dock-info small{display:block;font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:2px}
.mini-dock-btn{
  min-height:36px;padding:0 16px;border:0;border-radius:5px;flex:none;
  background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;
}
.mini-dock-btn:hover{background:var(--accent-hover)}

/* ================= WATCH VIEW ================= */
.watch-view{
  max-width:1360px;margin:0 auto;padding:16px 20px 64px;
  display:flex;flex-direction:column;gap:16px;
}
.watch-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.back-btn{
  min-height:36px;padding:0 12px;border-radius:5px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--text);font-size:12px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;
}
.back-btn:hover{border-color:var(--text);background:var(--surface-2)}
.watch-ep-pill{
  font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--accent);
}

.watch-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.player-col{min-width:0;display:flex;flex-direction:column;gap:14px}

.screen{
  position:relative;width:100%;height:min(70vh,630px);border-radius:5px;overflow:hidden;
  background:#000;border:1px solid var(--line-strong);
}
video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.screen-message{
  position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;
  align-items:center;justify-content:center;text-align:center;padding:24px;
  background:rgba(14,14,13,.88);color:var(--text);font-size:14px;line-height:1.55;
}
.screen-message.hidden{display:none}
.screen-message button{
  min-height:40px;padding:0 20px;border:0;border-radius:5px;
  background:var(--accent);color:var(--accent-ink);font-weight:700;
}
.screen-message button[hidden]{display:none}

.watch-controls{
  display:flex;flex-direction:column;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line);
}
.watch-title-row h2{font-family:var(--font-display);margin:0 0 4px;font-size:clamp(20px,2.2vw,26px);line-height:1.18}
.watch-title-row p{margin:0;color:var(--muted);font-size:13px}

.transport{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.transport button,.transport select{
  min-height:38px;padding:0 13px;border-radius:5px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--text);font-size:12px;font-weight:600;
}
.transport select{max-width:155px;padding:0 10px}
.transport button:hover:not(:disabled),.transport select:hover:not(:disabled){border-color:var(--text);background:var(--surface-2)}
.transport button:disabled{opacity:.35;cursor:default}

.episodes-box{
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;
  display:flex;flex-direction:column;gap:12px;max-height:calc(min(70vh,630px) + 120px);
}
.episodes-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.episodes-head h3{font-family:var(--font-display);margin:0;font-size:15px;font-weight:700}
.episodes-head span{font-family:var(--font-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

.ep-ranges{display:flex;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.ep-ranges[hidden]{display:none}
.ep-range-btn{
  padding:2px 0;border:0;border-bottom:2px solid transparent;background:transparent;
  color:var(--muted);font-family:var(--font-mono);font-size:11px;font-weight:700;
}
.ep-range-btn:hover,.ep-range-btn.active{color:var(--text);border-bottom-color:var(--accent)}

.episodes{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;
  overflow-y:auto;padding-right:2px;align-content:start;
  scrollbar-color:var(--line-strong) transparent;
}
.ep{
  min-height:40px;border-radius:4px;border:1px solid var(--line);background:var(--bg);
  color:var(--text);font-family:var(--font-mono);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
  display:grid;place-items:center;padding:4px;transition:border-color .15s,background .15s;
}
.ep:hover{border-color:var(--line-strong);background:var(--surface-2)}
.ep.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* ================= MOBILE ================= */
@media(max-width:860px){
  .topbar-inner{
    padding:10px 14px 12px;gap:10px;
    grid-template-columns:1fr auto;
    grid-template-areas:"brand actions" "search search";
  }
  .brand{grid-area:brand}
  .brand-mark-box{width:26px;height:26px;font-size:14px}
  .brand-name{font-size:16px}
  .top-actions{grid-area:actions}
  .sync-status{display:none}
  .stat-chip{font-size:10px}
  .sync-btn{min-height:32px;padding:0 10px;font-size:11px}
  .search-wrap{grid-area:search;max-width:none}
  .search-wrap input{height:42px;font-size:16px}

  .catalog-view{padding:14px 14px 92px;gap:20px}
  .hero-card{grid-template-columns:108px 1fr;gap:14px;padding-bottom:18px}
  .hero-poster{width:108px}
  .hero-info h1{font-size:20px}
  .hero-info p{font-size:12px;margin-bottom:12px}
  .hero-cta{min-height:38px;padding:0 16px;font-size:12px}

  .catalog-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px;margin-top:12px}
  .drama-card:hover .drama-thumb-box{transform:none}
  .drama-meta strong{font-size:12px;line-height:1.28}

  .watch-view{padding:12px 14px 44px;gap:12px}
  .watch-layout{grid-template-columns:1fr;gap:14px}
  .screen{height:min(64svh,520px)}
  .transport button,.transport select{min-height:40px;font-size:12px}
  .transport select{max-width:130px}
  .episodes-box{padding:13px;max-height:none}
  .episodes{grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;max-height:265px}
  .ep{min-height:40px;font-size:12px}
}
@media(max-width:340px){
  .catalog-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(prefers-reduced-motion:reduce){
  .drama-thumb-box,.ep,.sync-btn,.hero-cta{transition:none}
}
</style>
</head>
<body data-view="catalog">
<header class="topbar">
  <div class="topbar-inner">
    <button class="brand" id="brandBtn" type="button" aria-label="Kembali ke katalog">
      <span class="brand-mark-box">P</span>
      <span>
        <span class="brand-name">PANZEK<span>.</span>PLAYER</span>
        <span class="brand-tag">Arsip Drama</span>
      </span>
    </button>

    <div class="search-wrap">
      <label for="searchInput">Cari judul drama</label>
      <span class="search-icon" aria-hidden="true">/</span>
      <input id="searchInput" type="search" placeholder="Cari judul drama..." autocomplete="off">
    </div>

    <div class="top-actions">
      <span class="stat-chip" id="catalogStats">...</span>
      <button class="sync-btn" id="updateBtn" type="button">Update</button>
      <span class="sync-status" id="updateStatus" role="status">1j</span>
    </div>
  </div>
</header>

<main class="catalog-view" id="catalogView">
  <section class="hero-card" id="heroCard" hidden>
    <img class="hero-poster" id="heroPoster" src="" alt="" referrerpolicy="no-referrer">
    <div class="hero-info">
      <span class="hero-label">Sorotan</span>
      <h1 id="heroTitle">—</h1>
      <p>Seluruh episode tersedia untuk diputar langsung dengan pemulihan tautan otomatis dan subtitle.</p>
      <button class="hero-cta" id="heroPlayBtn" type="button">Putar Episode 1</button>
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2 id="catalogHeading">Katalog Drama</h2>
      <span id="catalogHint">Memuat daftar...</span>
    </div>
    <div class="catalog-grid" id="catalogList"></div>
  </section>

  <div class="mini-dock" id="miniDock" hidden>
    <div class="mini-dock-inner">
      <img id="miniPoster" src="" alt="" referrerpolicy="no-referrer">
      <div class="mini-dock-info">
        <strong id="miniTitle">—</strong>
        <small id="miniEp">Lanjutkan menonton</small>
      </div>
      <button class="mini-dock-btn" id="miniResumeBtn" type="button">Lanjut</button>
    </div>
  </div>
</main>

<section class="watch-view" id="watchView">
  <div class="watch-bar">
    <button class="back-btn" id="backBtn" type="button">← Katalog</button>
    <span class="watch-ep-pill" id="episodeBadge">—</span>
  </div>

  <div class="watch-layout">
    <div class="player-col">
      <div class="screen" id="playerWrap">
        <video id="video" controls playsinline preload="metadata"></video>
        <div class="screen-message" id="screenMessage" role="status">
          <span id="screenMessageText">Memuat episode...</span>
          <button id="retryBtn" type="button" hidden>Coba lagi</button>
        </div>
      </div>

      <div class="watch-controls">
        <div class="watch-title-row">
          <div>
            <h2 id="dramaTitle">Pilih drama</h2>
            <p id="dramaSubtitle">Mengambil daftar episode...</p>
          </div>
        </div>
        <div class="transport">
          <select id="resSelect" aria-label="Pilih kualitas" hidden></select>
          <select id="subSelect" aria-label="Pilih subtitle" hidden></select>
          <button id="prevBtn" type="button" aria-label="Episode sebelumnya">← Sebelumnya</button>
          <button id="nextBtn" type="button" aria-label="Episode berikutnya">Berikutnya →</button>
        </div>
      </div>
    </div>

    <aside class="episodes-box">
      <div class="episodes-head">
        <h3>Daftar Episode</h3>
        <span id="episodeCount">0 ep</span>
      </div>
      <div class="ep-ranges" id="epRanges" hidden></div>
      <div class="episodes" id="epStrip"></div>
    </aside>
  </div>
</section>

<script src="app.js?v=13"></script>
</body>
</html>
