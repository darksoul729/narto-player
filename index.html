<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Panzek Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
:root{
  --bg:#060609;
  --bg-2:#0e0f16;
  --card:#12131c;
  --glass:rgba(16,17,25,.82);
  --line:rgba(255,255,255,.09);
  --line-strong:rgba(255,255,255,.18);
  --text:#f7f8fc;
  --muted:#9599ad;
  --accent:#8b5cf6;
  --accent-2:#ec4899;
  --accent-grad:linear-gradient(135deg,#8b5cf6,#ec4899);
  --accent-soft:rgba(139,92,246,.16);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{
  background-image:
    radial-gradient(640px 420px at 12% -6%,rgba(139,92,246,.16),transparent 65%),
    radial-gradient(540px 360px at 95% 4%,rgba(236,72,153,.11),transparent 62%);
  background-attachment:fixed;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select{font:inherit}
button{cursor:pointer;touch-action:manipulation}

/* App Shell & View Switching */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(6,6,9,.84);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.topbar-inner{
  max-width:1360px;margin:0 auto;padding:12px 16px;
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
}
.brand{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:0;color:var(--text);text-align:left}
.brand-icon{
  width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:var(--accent-grad);color:#fff;font-weight:900;font-size:15px;
  box-shadow:0 8px 22px rgba(139,92,246,.38);
}
.brand-name{font-size:16px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.brand-name span{background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-tag{display:block;font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}

.search-wrap{position:relative;max-width:480px;width:100%;justify-self:center}
.search-wrap label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.search-wrap input{
  width:100%;height:40px;padding:0 14px 0 36px;border-radius:999px;outline:0;
  border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);font-size:14px;
  transition:border-color .18s,background .18s,box-shadow .18s;
}
.search-wrap input::placeholder{color:#767b91}
.search-wrap input:focus{border-color:var(--accent);background:rgba(255,255,255,.09);box-shadow:0 0 0 3px var(--accent-soft)}

.top-actions{display:flex;align-items:center;gap:8px;justify-self:end}
.stat-chip{
  padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.05);
  border:1px solid var(--line);font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;
}
.sync-btn{
  min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line-strong);
  background:rgba(255,255,255,.07);color:var(--text);font-size:12px;font-weight:600;white-space:nowrap;
}
.sync-btn:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.sync-btn:disabled{opacity:.55;cursor:wait}
.sync-status{font-size:11px;color:var(--muted);white-space:nowrap}

body[data-view="watch"] .catalog-view{display:none}
body[data-view="catalog"] .watch-view{display:none}

/* ================= CATALOG VIEW (MOBILE-FIRST HOME) ================= */
.catalog-view{
  max-width:1360px;margin:0 auto;padding:16px 16px 104px;
  display:flex;flex-direction:column;gap:22px;
}

/* Spotlight Featured Banner */
.hero-card{
  position:relative;border-radius:22px;overflow:hidden;
  border:1px solid var(--line-strong);background:var(--card);
  min-height:220px;display:grid;grid-template-columns:136px 1fr;gap:18px;align-items:center;padding:18px;
  box-shadow:0 24px 56px rgba(0,0,0,.5);
}
.hero-card[hidden]{display:none}
.hero-backdrop{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:blur(42px) saturate(1.4) brightness(.34);transform:scale(1.2);pointer-events:none;
}
.hero-card::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(6,6,9,.72),rgba(6,6,9,.52) 60%,rgba(6,6,9,.82));pointer-events:none;
}
.hero-poster,.hero-info{position:relative;z-index:1}
.hero-poster{
  width:136px;aspect-ratio:3/4;border-radius:14px;object-fit:cover;
  background:#181a26;border:1px solid rgba(255,255,255,.16);
  box-shadow:0 14px 32px rgba(0,0,0,.55);
}
.hero-pill{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  background:var(--accent-soft);border:1px solid rgba(139,92,246,.45);
  color:#ddd6fe;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;
}
.hero-info h1{margin:0 0 6px;font-size:clamp(19px,3.2vw,30px);line-height:1.18;letter-spacing:-.03em}
.hero-info p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.45}
.hero-cta{
  min-height:42px;padding:0 20px;border:0;border-radius:12px;
  background:var(--accent-grad);color:#fff;font-size:13px;font-weight:700;
  box-shadow:0 10px 26px rgba(139,92,246,.38);display:inline-flex;align-items:center;gap:8px;
}
.hero-cta:active{transform:scale(.97)}

.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.section-head h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.section-head span{font-size:12px;color:var(--muted)}

/* True Mobile-First Poster Grid (3 columns on phones, responsive up to 6 on desktop) */
.catalog-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;
}
.drama-card{
  position:relative;display:flex;flex-direction:column;padding:0;border:1px solid var(--line);
  border-radius:15px;overflow:hidden;background:var(--card);color:var(--text);text-align:left;
  transition:transform .18s,border-color .18s,box-shadow .18s;
}
.drama-card:hover,.drama-card:focus-visible{
  transform:translateY(-3px);border-color:rgba(139,92,246,.65);
  box-shadow:0 14px 32px rgba(0,0,0,.45);outline:0;
}
.drama-card.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(139,92,246,.32)}
.drama-thumb-box{position:relative;aspect-ratio:3/4;width:100%;overflow:hidden;background:#161722}
.drama-thumb-box img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
.drama-card:hover .drama-thumb-box img{transform:scale(1.04)}
.drama-thumb-box::after{
  content:"";position:absolute;inset:auto 0 0 0;height:52%;
  background:linear-gradient(180deg,transparent,rgba(6,6,9,.92));pointer-events:none;
}
.drama-play-chip{
  position:absolute;right:8px;bottom:8px;z-index:2;
  width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  background:rgba(18,19,28,.78);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:10px;
}
.drama-card.active .drama-play-chip{background:var(--accent-grad);border-color:transparent}
.drama-badge{
  position:absolute;top:8px;left:8px;z-index:2;display:none;
  padding:3px 8px;border-radius:8px;background:var(--accent-grad);color:#fff;
  font-size:10px;font-weight:700;
}
.drama-card.active .drama-badge{display:inline-flex}
.drama-meta{padding:10px 10px 12px;display:flex;flex-direction:column;gap:3px}
.drama-meta strong{
  font-size:13px;font-weight:600;line-height:1.32;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
}
.drama-meta small{font-size:11px;color:var(--muted)}

.catalog-more{
  grid-column:1 / -1;justify-self:center;min-height:44px;padding:0 28px;border-radius:999px;
  border:1px solid var(--line-strong);background:var(--card);color:var(--text);font-size:13px;font-weight:700;
}
.catalog-more:hover{border-color:var(--accent);background:var(--accent-soft)}
.empty{grid-column:1 / -1;padding:28px 6px;color:var(--muted);font-size:14px;text-align:center}

/* Mini-Player Continue Dock (shown in catalog view after a drama was opened) */
.mini-dock{
  position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:45;
  max-width:560px;margin:0 auto;padding:10px 12px;border-radius:16px;
  background:rgba(18,19,29,.92);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid rgba(139,92,246,.42);box-shadow:0 18px 42px rgba(0,0,0,.65);
  display:flex;align-items:center;gap:12px;
}
.mini-dock[hidden]{display:none}
.mini-dock img{width:38px;height:50px;border-radius:8px;object-fit:cover;background:#1d1e2c;flex:none}
.mini-dock-info{min-width:0;flex:1}
.mini-dock-info strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-dock-info small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.mini-dock-btn{
  min-height:36px;padding:0 14px;border:0;border-radius:10px;flex:none;
  background:var(--accent-grad);color:#fff;font-size:12px;font-weight:700;
}

/* ================= WATCH VIEW (DEDICATED PLAYER PAGE) ================= */
.watch-view{
  max-width:1360px;margin:0 auto;padding:16px 20px 64px;
  display:flex;flex-direction:column;gap:16px;
}
.watch-bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back-btn{
  min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);
  background:rgba(255,255,255,.06);color:var(--text);font-size:12px;font-weight:700;
  display:inline-flex;align-items:center;gap:7px;
}
.back-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.watch-ep-pill{
  padding:6px 12px;border-radius:999px;background:var(--accent-soft);
  border:1px solid rgba(139,92,246,.42);color:#e9d5ff;font-size:12px;font-weight:700;
}

.watch-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.player-col{min-width:0;display:flex;flex-direction:column;gap:12px}

.screen{
  position:relative;width:100%;height:min(70vh,630px);border-radius:20px;overflow:hidden;
  background:#020204;border:1px solid var(--line-strong);box-shadow:0 24px 64px rgba(0,0,0,.6);
}
video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.screen-message{
  position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;
  align-items:center;justify-content:center;text-align:center;padding:24px;
  background:linear-gradient(180deg,rgba(6,6,9,.55),rgba(6,6,9,.88));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:#f7f8fc;font-size:14px;line-height:1.55;
}
.screen-message.hidden{display:none}
.screen-message button{
  min-height:42px;padding:0 22px;border:0;border-radius:999px;
  background:var(--accent-grad);color:#fff;font-weight:700;
}
.screen-message button[hidden]{display:none}

.watch-controls{
  background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--line);border-radius:18px;padding:15px 17px;
  display:flex;flex-direction:column;gap:12px;
}
.watch-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.watch-title-row h2{margin:0 0 3px;font-size:clamp(18px,2.2vw,24px);letter-spacing:-.025em;line-height:1.2}
.watch-title-row p{margin:0;color:var(--muted);font-size:12px}

.transport{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.transport button,.transport select{
  min-height:38px;padding:0 13px;border-radius:11px;border:1px solid var(--line-strong);
  background:rgba(255,255,255,.06);color:var(--text);font-size:12px;font-weight:600;
}
.transport select{max-width:155px;padding:0 10px}
.transport select option{background:#12131c;color:var(--text)}
.transport button:hover:not(:disabled),.transport select:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.transport button:disabled{opacity:.36;cursor:default}

.episodes-box{
  background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--line);border-radius:20px;padding:16px;
  display:flex;flex-direction:column;gap:12px;max-height:calc(min(70vh,630px) + 120px);
}
.episodes-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.episodes-head h3{margin:0;font-size:15px;font-weight:700}
.episodes-head span{
  padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.06);
  border:1px solid var(--line);font-size:11px;font-weight:700;color:#d8b4fe;
}
.ep-ranges{display:flex;gap:6px;flex-wrap:wrap}
.ep-ranges[hidden]{display:none}
.ep-range-btn{
  padding:5px 10px;border-radius:8px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--muted);font-size:11px;font-weight:600;
}
.ep-range-btn:hover,.ep-range-btn.active{border-color:var(--accent);color:#fff;background:var(--accent-soft)}

.episodes{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;
  overflow-y:auto;padding-right:2px;align-content:start;
  scrollbar-color:rgba(255,255,255,.2) transparent;
}
.ep{
  min-height:42px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:#e2e4f0;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;
  display:grid;place-items:center;padding:4px;transition:background .15s,border-color .15s;
}
.ep:hover{border-color:rgba(139,92,246,.55);background:rgba(255,255,255,.09)}
.ep.active{background:var(--accent-grad);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(139,92,246,.35)}

/* ================= MOBILE OPTIMIZATION ================= */
@media(max-width:860px){
  .topbar-inner{
    padding:10px 14px 12px;gap:10px;
    grid-template-columns:1fr auto;
    grid-template-areas:"brand actions" "search search";
  }
  .brand{grid-area:brand}
  .brand-icon{width:32px;height:32px;font-size:14px;border-radius:10px}
  .brand-name{font-size:15px}
  .top-actions{grid-area:actions}
  .sync-status{display:none}
  .stat-chip{padding:5px 9px;font-size:10px}
  .sync-btn{min-height:34px;padding:0 11px;font-size:11px}
  .search-wrap{grid-area:search;max-width:none}
  .search-wrap input{height:42px;font-size:16px}

  .catalog-view{padding:12px 12px 96px;gap:16px}
  .hero-card{grid-template-columns:104px 1fr;gap:14px;padding:14px;min-height:168px;border-radius:18px}
  .hero-poster{width:104px;border-radius:11px}
  .hero-info h1{font-size:18px}
  .hero-info p{font-size:12px;margin-bottom:11px}
  .hero-cta{min-height:38px;padding:0 15px;font-size:12px}

  /* 3-column poster catalog grid on phone */
  .catalog-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
  .drama-card{border-radius:12px}
  .drama-card:hover{transform:none}
  .drama-play-chip{width:24px;height:24px;right:6px;bottom:6px;font-size:9px}
  .drama-meta{padding:7px 7px 9px}
  .drama-meta strong{font-size:11.5px;line-height:1.28}
  .drama-meta small{display:none}

  /* Immersive Watch View on phone */
  .watch-view{padding:10px 12px 44px;gap:12px}
  .watch-layout{grid-template-columns:1fr;gap:14px}
  .screen{height:min(64svh,520px);border-radius:18px}
  .watch-controls{padding:13px 14px;border-radius:16px}
  .transport button,.transport select{min-height:40px;font-size:12px}
  .transport select{max-width:130px}
  .episodes-box{padding:13px;border-radius:16px;max-height:none}
  .episodes{grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;max-height:270px}
  .ep{min-height:42px;font-size:12px}
}
@media(max-width:340px){
  .catalog-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(prefers-reduced-motion:reduce){
  .drama-card,.drama-thumb-box img,.ep{transition:none}
}
</style>
</head>
<body data-view="catalog">
<header class="topbar">
  <div class="topbar-inner">
    <button class="brand" id="brandBtn" type="button" aria-label="Kembali ke katalog">
      <span class="brand-icon">P</span>
      <span>
        <span class="brand-name">Panzek <span>Player</span></span>
        <span class="brand-tag">Drama Catalog</span>
      </span>
    </button>

    <div class="search-wrap">
      <label for="searchInput">Cari judul drama</label>
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" placeholder="Cari judul drama..." autocomplete="off">
    </div>

    <div class="top-actions">
      <span class="stat-chip" id="catalogStats">Memuat...</span>
      <button class="sync-btn" id="updateBtn" type="button">Update</button>
      <span class="sync-status" id="updateStatus" role="status">Otomatis/jam</span>
    </div>
  </div>
</header>

<main class="catalog-view" id="catalogView">
  <section class="hero-card" id="heroCard" hidden>
    <img class="hero-backdrop" id="heroBackdrop" src="" alt="" referrerpolicy="no-referrer">
    <img class="hero-poster" id="heroPoster" src="" alt="" referrerpolicy="no-referrer">
    <div class="hero-info">
      <span class="hero-pill">Pilihan Unggulan</span>
      <h1 id="heroTitle">—</h1>
      <p id="heroSub">Klik untuk membuka seluruh episode dan mulai menonton.</p>
      <button class="hero-cta" id="heroPlayBtn" type="button">▶ Tonton Sekarang</button>
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2 id="catalogHeading">Katalog Drama</h2>
      <span id="catalogHint">Memuat daftar...</span>
    </div>
    <div class="catalog-grid" id="catalogList" style="margin-top:12px"></div>
  </section>

  <div class="mini-dock" id="miniDock" hidden>
    <img id="miniPoster" src="" alt="" referrerpolicy="no-referrer">
    <div class="mini-dock-info">
      <strong id="miniTitle">—</strong>
      <small id="miniEp">Lanjutkan menonton</small>
    </div>
    <button class="mini-dock-btn" id="miniResumeBtn" type="button">Lanjut</button>
  </div>
</main>

<section class="watch-view" id="watchView">
  <div class="watch-bar">
    <button class="back-btn" id="backBtn" type="button">← Kembali ke Katalog</button>
    <span class="watch-ep-pill" id="episodeBadge">—</span>
  </div>

  <div class="watch-layout">
    <div class="player-col">
      <div class="screen" id="playerWrap">
        <video id="video" controls playsinline preload="metadata"></video>
        <div class="screen-message" id="screenMessage" role="status">
          <span id="screenMessageText">Memuat episode...</span>
          <button id="retryBtn" type="button" hidden>Coba lagi</button>
        </div>
      </div>

      <div class="watch-controls">
        <div class="watch-title-row">
          <div>
            <h2 id="dramaTitle">Pilih drama</h2>
            <p id="dramaSubtitle">Mengambil daftar episode...</p>
          </div>
        </div>
        <div class="transport">
          <select id="resSelect" aria-label="Pilih kualitas" hidden></select>
          <select id="subSelect" aria-label="Pilih subtitle" hidden></select>
          <button id="prevBtn" type="button" aria-label="Episode sebelumnya">← Sebelumnya</button>
          <button id="nextBtn" type="button" aria-label="Episode berikutnya">Berikutnya →</button>
        </div>
      </div>
    </div>

    <aside class="episodes-box">
      <div class="episodes-head">
        <h3>Daftar Episode</h3>
        <span id="episodeCount">0 episode</span>
      </div>
      <div class="ep-ranges" id="epRanges" hidden></div>
      <div class="episodes" id="epStrip"></div>
    </aside>
  </div>
</section>

<script src="app.js?v=12"></script>
</body>
</html>
