<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panzek Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
:root{
  --bg:#080c0c;
  --bg-2:#0e1516;
  --surface:rgba(16,25,26,.76);
  --surface-2:rgba(24,36,38,.88);
  --line:rgba(216,236,228,.11);
  --line-strong:rgba(216,236,228,.22);
  --text:#f5f2eb;
  --muted:#94a6a2;
  --accent:#f0b44b;
  --accent-ink:#171206;
  --accent-soft:rgba(240,180,75,.16);
  --mint:#3dd9ad;
  --mint-soft:rgba(61,217,173,.14);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{
  position:relative;overflow-x:hidden;
  background-image:
    radial-gradient(960px 520px at 8% -8%,rgba(61,217,173,.11),transparent 62%),
    radial-gradient(900px 500px at 92% -4%,rgba(240,180,75,.12),transparent 60%);
  background-attachment:fixed;
}
button,input,select{font:inherit}
button{cursor:pointer;touch-action:manipulation}

/* Dynamic Blurred Poster Atmosphere */
.ambient-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
}
.ambient-bg img{
  width:100%;height:100%;object-fit:cover;
  filter:blur(72px) saturate(1.35) brightness(.32);
  transform:scale(1.18);opacity:.55;transition:opacity .45s ease;
}
.ambient-bg::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(8,12,12,.58) 0%,rgba(8,12,12,.92) 55%,var(--bg) 100%);
}

/* Floating Glass Header Pill */
.header-shell{
  position:sticky;top:12px;z-index:40;max-width:1400px;margin:12px auto 0;padding:0 24px;
}
.navbar{
  display:grid;grid-template-columns:auto minmax(220px,440px) auto;align-items:center;gap:18px;
  padding:11px 18px;border-radius:20px;
  background:rgba(12,19,20,.82);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--line-strong);
  box-shadow:0 16px 40px rgba(0,0,0,.42);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-prism{
  width:36px;height:36px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,#f6c86e,#d99026);
  color:var(--accent-ink);font-weight:900;font-size:15px;
  box-shadow:0 8px 22px rgba(240,180,75,.28);
}
.brand-mark{font-size:17px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.brand-mark span{color:var(--accent)}
.brand-sub{display:block;font-size:10px;color:var(--mint);letter-spacing:.14em;text-transform:uppercase;margin-top:2px;font-weight:700}

.search-box{position:relative;width:100%}
.search-box label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.search-box input{
  width:100%;height:40px;padding:0 16px 0 38px;border-radius:12px;outline:0;
  border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);font-size:14px;
  transition:border-color .18s,background .18s,box-shadow .18s;
}
.search-box input::placeholder{color:#778985}
.search-box input:focus{border-color:var(--accent);background:rgba(255,255,255,.08);box-shadow:0 0 0 3px var(--accent-soft)}

.nav-actions{display:flex;align-items:center;gap:10px;justify-self:end}
.stat-pill{
  padding:7px 12px;border-radius:11px;border:1px solid var(--line);
  background:rgba(255,255,255,.035);color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;
}
.update-btn{
  min-height:38px;padding:0 14px;border-radius:11px;
  border:1px solid rgba(240,180,75,.38);background:var(--accent-soft);color:#fde6b8;
  font-size:12px;font-weight:700;white-space:nowrap;
  transition:background .15s,border-color .15s,transform .12s;
}
.update-btn:hover:not(:disabled){background:rgba(240,180,75,.25);border-color:var(--accent)}
.update-btn:active:not(:disabled){transform:scale(.97)}
.update-btn:disabled{opacity:.55;cursor:wait}
.update-status{color:var(--muted);font-size:11px;white-space:nowrap;max-width:128px;overflow:hidden;text-overflow:ellipsis}

/* Main Workspace */
.container{
  position:relative;z-index:1;max-width:1400px;margin:0 auto;
  padding:22px 24px 76px;display:flex;flex-direction:column;gap:30px;
}
.container.searching .catalog-section{order:-1}

/* Unified Bento Cinema Card */
.cinema-bento{
  display:grid;grid-template-columns:minmax(0,1.45fr) minmax(340px,.95fr);
  border-radius:24px;overflow:hidden;
  background:var(--surface);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
  border:1px solid var(--line-strong);
  box-shadow:0 32px 80px rgba(0,0,0,.55);
}

.stage-pane{
  position:relative;background:#040707;display:flex;flex-direction:column;
  border-right:1px solid var(--line);
}
.screen{
  position:relative;width:100%;height:min(70vh,630px);background:#030505;overflow:hidden;
}
video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.screen-message{
  position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;
  align-items:center;justify-content:center;text-align:center;padding:24px;
  background:linear-gradient(180deg,rgba(8,12,12,.54),rgba(8,12,12,.88));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:#f5f2eb;font-size:14px;line-height:1.6;
}
.screen-message.hidden{display:none}
.screen-message button{
  min-height:42px;padding:0 24px;border:0;border-radius:12px;
  background:var(--accent);color:var(--accent-ink);font-weight:800;
  box-shadow:0 10px 26px rgba(240,180,75,.32);
}
.screen-message button[hidden]{display:none}

/* Transport Bar docked beneath video inside left pane */
.stage-bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:13px 18px;background:rgba(10,16,17,.9);border-top:1px solid var(--line);
}
.now-playing{display:flex;align-items:center;gap:10px}
.now-playing small{color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.now-playing strong{
  padding:5px 11px;border-radius:9px;
  background:var(--mint-soft);border:1px solid rgba(61,217,173,.35);
  color:#b9f8e4;font-size:12px;font-weight:700;
}
.transport{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.transport button,.transport select{
  min-height:36px;padding:0 12px;border-radius:10px;
  border:1px solid var(--line-strong);background:rgba(255,255,255,.05);color:var(--text);
  font-size:12px;font-weight:600;transition:background .15s,border-color .15s,transform .12s;
}
.transport select{max-width:150px;padding:0 9px}
.transport select option{background:#0e1516;color:var(--text)}
.transport button:hover:not(:disabled),.transport select:hover:not(:disabled){background:rgba(255,255,255,.11);border-color:var(--accent)}
.transport button:active:not(:disabled){transform:scale(.97)}
.transport button:disabled{opacity:.35;cursor:default}

/* Right Info & Episode Pane */
.info-pane{
  display:flex;flex-direction:column;padding:20px;gap:16px;
  max-height:calc(min(70vh,630px) + 64px);min-width:0;
}
.drama-header{display:flex;gap:14px;align-items:flex-start;padding-bottom:14px;border-bottom:1px solid var(--line)}
.drama-thumb{
  width:64px;height:86px;border-radius:12px;object-fit:cover;flex:none;
  background:#141e20;border:1px solid var(--line-strong);box-shadow:0 8px 20px rgba(0,0,0,.4);
}
.drama-thumb[src=""]{display:none}
.drama-titles{min-width:0;flex:1}
.eyebrow{
  display:inline-flex;align-items:center;gap:6px;margin:0 0 6px;
  color:var(--mint);font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}
h1{font-size:clamp(18px,1.8vw,24px);line-height:1.22;letter-spacing:-.025em;margin:0 0 5px}
.subhead{margin:0;color:var(--muted);font-size:12px}

.episodes-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.episodes-head h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.episodes-head span{
  padding:4px 10px;border-radius:9px;background:rgba(255,255,255,.05);
  border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--accent);
}
.ep-ranges{display:flex;gap:6px;flex-wrap:wrap}
.ep-ranges[hidden]{display:none}
.ep-range-btn{
  padding:5px 10px;border-radius:8px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);color:var(--muted);font-size:11px;font-weight:600;
}
.ep-range-btn:hover,.ep-range-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.episodes{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;
  overflow-y:auto;padding-right:2px;align-content:start;flex:1;
  scrollbar-color:rgba(216,236,228,.2) transparent;
}
.ep{
  min-height:42px;background:rgba(255,255,255,.04);
  border:1px solid var(--line);border-radius:10px;
  color:#e4e8e6;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 4px;
  transition:background .15s,border-color .15s,transform .12s;
}
.ep span{display:none}
.ep:hover{border-color:rgba(240,180,75,.5);background:rgba(255,255,255,.09)}
.ep.active{
  background:var(--accent);border-color:var(--accent);color:var(--accent-ink);
  box-shadow:0 6px 18px rgba(240,180,75,.28);
}
.ep:disabled{opacity:.35;cursor:default}

/* Catalog Section */
.catalog-section{display:flex;flex-direction:column;gap:16px}
.catalog-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.catalog-head h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.catalog-head span{color:var(--muted);font-size:12px}

.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:16px}
.drama{
  position:relative;display:flex;flex-direction:column;text-align:left;padding:0;
  border:1px solid var(--line);border-radius:16px;overflow:hidden;
  background:var(--bg-2);color:var(--text);
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.drama:hover,.drama:focus-visible{
  transform:translateY(-3px);border-color:rgba(240,180,75,.5);
  box-shadow:0 18px 36px rgba(0,0,0,.45);outline:0;
}
.drama.active{
  border-color:var(--accent);
  box-shadow:0 0 0 2px rgba(240,180,75,.3),0 18px 36px rgba(0,0,0,.5);
}
.drama-poster{position:relative;aspect-ratio:3/4;width:100%;overflow:hidden;background:#131d1f}
.drama img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.drama:hover img{transform:scale(1.04)}
.drama-poster::after{
  content:"";position:absolute;inset:auto 0 0 0;height:52%;
  background:linear-gradient(180deg,transparent,rgba(8,12,12,.94));pointer-events:none;
}
.drama-tag{
  position:absolute;top:9px;left:9px;z-index:2;
  padding:4px 9px;border-radius:8px;font-size:10px;font-weight:800;letter-spacing:.04em;
  display:none;background:var(--accent);color:var(--accent-ink);
}
.drama.active .drama-tag{display:inline-flex}
.drama-body{padding:11px 12px 13px;display:flex;flex-direction:column;gap:4px}
.drama strong{
  font-size:13px;font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
}
.drama small{color:var(--muted);font-size:11px}

.catalog-more{
  grid-column:1 / -1;justify-self:center;min-height:42px;padding:0 26px;border-radius:12px;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--text);
  font-size:13px;font-weight:700;
}
.catalog-more:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.empty{grid-column:1 / -1;color:var(--muted);font-size:14px;padding:24px 6px}

/* Mobile */
@media(max-width:960px){
  .header-shell{top:0;margin:0;padding:0}
  .navbar{
    border-radius:0;border-left:0;border-right:0;border-top:0;
    padding:calc(10px + env(safe-area-inset-top)) 14px 12px;gap:10px;
    grid-template-columns:1fr auto;grid-template-areas:"brand actions" "search search";
  }
  .brand-prism{width:32px;height:32px;font-size:13px;border-radius:10px}
  .brand-mark{font-size:16px}
  .stat-pill,.update-status{display:none}
  .update-btn{min-height:34px;padding:0 12px;font-size:11px}
  .search-box{grid-area:search}
  .search-box input{height:42px;font-size:16px}

  .container{padding:14px 14px calc(44px + env(safe-area-inset-bottom));gap:18px}
  .cinema-bento{grid-template-columns:1fr;border-radius:20px}
  .stage-pane{border-right:0;border-bottom:1px solid var(--line)}
  .screen{height:min(62svh,520px)}
  .stage-bar{padding:11px 13px;gap:10px}
  .transport{width:100%}
  .transport button,.transport select{min-height:40px;padding:0 11px;font-size:12px}
  .transport select{max-width:128px}

  .info-pane{padding:14px;gap:12px;max-height:none}
  .drama-thumb{width:50px;height:68px;border-radius:9px}
  .episodes{grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;max-height:265px}
  .ep{min-height:42px;font-size:12px}

  .catalog-section{order:-1}
  .catalog{
    display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;
    scroll-snap-type:x proximity;scrollbar-width:none;
  }
  .catalog::-webkit-scrollbar{display:none}
  .drama{flex:none;width:108px;border-radius:13px;scroll-snap-align:start}
  .drama:hover{transform:none}
  .drama-body{padding:8px}
  .drama strong{font-size:11px;line-height:1.25}
  .drama small{display:none}
  .catalog-more{min-width:108px;min-height:144px;border-radius:13px;padding:0 12px;font-size:12px}
}
@media(prefers-reduced-motion:reduce){
  .ambient-bg img,.drama,.drama img,.ep,.transport button,.update-btn{transition:none}
}
</style>
</head>
<body>
<div class="ambient-bg" aria-hidden="true"><img id="ambientPoster" src="" alt=""></div>

<div class="header-shell">
  <header class="navbar">
    <div class="brand">
      <div class="brand-prism">P</div>
      <div>
        <div class="brand-mark">Panzek <span>Player</span></div>
        <span class="brand-sub">Cinema Hub</span>
      </div>
    </div>

    <div class="search-box">
      <label for="searchInput">Cari judul drama</label>
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" placeholder="Cari drama..." autocomplete="off">
    </div>

    <div class="nav-actions">
      <span class="stat-pill" id="catalogStats">Memuat...</span>
      <button class="update-btn" id="updateBtn" type="button">Update katalog</button>
      <span class="update-status" id="updateStatus" role="status">Otomatis tiap jam</span>
    </div>
  </header>
</div>

<main class="container">
  <section class="cinema-bento">
    <div class="stage-pane">
      <div class="screen" id="playerWrap">
        <video id="video" controls playsinline preload="metadata"></video>
        <div class="screen-message" id="screenMessage" role="status">
          <span id="screenMessageText">Memuat katalog...</span>
          <button id="retryBtn" type="button" hidden>Coba lagi</button>
        </div>
      </div>

      <div class="stage-bar">
        <div class="now-playing">
          <small>Episode</small>
          <strong id="episodeBadge">—</strong>
        </div>
        <div class="transport">
          <select id="resSelect" aria-label="Pilih kualitas" hidden></select>
          <select id="subSelect" aria-label="Pilih subtitle" hidden></select>
          <button id="prevBtn" type="button" aria-label="Episode sebelumnya">← Sebelumnya</button>
          <button id="nextBtn" type="button" aria-label="Episode berikutnya">Berikutnya →</button>
        </div>
      </div>
    </div>

    <aside class="info-pane">
      <div class="drama-header">
        <img class="drama-thumb" id="dramaThumb" src="" alt="" referrerpolicy="no-referrer">
        <div class="drama-titles">
          <p class="eyebrow">Sedang diputar</p>
          <h1 id="dramaTitle">Pilih drama</h1>
          <p class="subhead" id="dramaSubtitle">Pilih judul dari katalog untuk mulai menonton.</p>
        </div>
      </div>

      <div class="episodes-head">
        <h2>Daftar episode</h2>
        <span id="episodeCount">0 episode</span>
      </div>
      <div class="ep-ranges" id="epRanges" hidden></div>
      <div class="episodes" id="epStrip"></div>
    </aside>
  </section>

  <section class="catalog-section">
    <div class="catalog-head">
      <h2 id="catalogHeading">Jelajahi drama</h2>
      <span id="catalogHint">Pilih poster drama untuk memutar</span>
    </div>
    <div class="catalog" id="catalogList"></div>
  </section>
</main>

<script src="app.js?v=11"></script>
</body>
</html>
