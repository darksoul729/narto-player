<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Panzek Player</title>
<link rel="preconnect" href="https://img.nartodrama-api.online" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script defer src="app.js?v=16"></script>
<style>
:root{
  --bg:#0b0e13;
  --bg-depth:#10151d;
  --glass:rgba(22,28,38,.74);
  --glass-btn:rgba(255,255,255,.08);
  --glass-btn-hover:rgba(255,255,255,.15);
  --glass-accent:rgba(229,169,60,.24);
  --glass-accent-hover:rgba(229,169,60,.36);
  --line:rgba(226,236,248,.13);
  --line-strong:rgba(226,236,248,.22);
  --line-accent:rgba(229,169,60,.62);
  --specular:inset 0 1px 0 rgba(255,255,255,.15);
  --specular-accent:inset 0 1px 0 rgba(255,226,164,.35);
  --text:#f3f5f8;
  --muted:#9aa3b2;
  --accent:#e5a93c;
  --accent-text:#fde7b6;
  --teal:#2dd4bf;
  --font-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --font-body:"DM Sans",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden],svg[hidden]{display:none !important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
body{
  background-color:var(--bg);
  background-image:radial-gradient(1200px 600px at 50% -180px,#182230 0%,transparent 70%);
  background-repeat:no-repeat;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select{font:inherit}
button{cursor:pointer;touch-action:manipulation}
.lucide{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand-mark-box .lucide{width:14px;height:14px;fill:currentColor}
.search-icon{display:grid;place-items:center}
.sync-btn,.catalog-more,.mini-dock-btn,.screen-message button,.transport button,.back-btn,.hero-cta{display:inline-flex;align-items:center;justify-content:center;gap:7px}

/* Frosted Glass Sticky Header (single GPU blur surface) */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(13,17,24,.78);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  border-bottom:1px solid var(--line);
  box-shadow:0 8px 24px rgba(0,0,0,.3);
  padding-top:env(safe-area-inset-top);
}
.topbar-inner{
  max-width:1360px;margin:0 auto;padding:12px 20px;
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;
}
.brand{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:0;color:var(--text);text-align:left}
.brand-mark-box{
  width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:var(--glass-accent);border:1px solid var(--line-accent);
  box-shadow:var(--specular-accent);color:var(--accent-text);
}
.brand-name{font-family:var(--font-display);font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1}
.brand-name span{color:var(--accent)}
.brand-tag{display:block;font-family:var(--font-mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}

.search-wrap{position:relative;max-width:480px;width:100%;justify-self:center}
.search-wrap label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-wrap input{
  width:100%;height:40px;padding:0 36px 0 36px;border-radius:10px;outline:0;
  border:1px solid var(--line-strong);background:rgba(255,255,255,.06);box-shadow:var(--specular);
  color:var(--text);font-size:14px;transition:border-color .15s,background .15s;
}
.search-wrap input::-webkit-search-cancel-button{display:none}
.search-wrap input::placeholder{color:#7c8698}
.search-wrap input:focus{border-color:var(--accent);background:rgba(255,255,255,.1)}
.search-clear{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border:0;border-radius:7px;padding:0;
  background:transparent;color:var(--muted);display:grid;place-items:center;
}
.search-clear[hidden]{display:none}
.search-clear:hover{background:rgba(255,255,255,.1);color:var(--text)}

.top-actions{display:flex;align-items:center;gap:10px;justify-self:end}
.stat-chip{
  padding:5px 10px;border-radius:8px;background:var(--glass-btn);border:1px solid var(--line);box-shadow:var(--specular);
  font-family:var(--font-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;
}
.sync-btn{
  min-height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line-strong);
  background:var(--glass-btn);box-shadow:var(--specular);
  color:var(--text);font-size:12px;font-weight:600;white-space:nowrap;
  transition:border-color .15s,background .15s,transform .12s;
}
.sync-btn:hover:not(:disabled){border-color:var(--line-accent);background:var(--glass-btn-hover)}
.sync-btn:active:not(:disabled){transform:scale(.97)}
.sync-btn:disabled{opacity:.5;cursor:wait}
.sync-status{font-family:var(--font-mono);font-size:10px;color:var(--muted);white-space:nowrap}

body[data-view="watch"] .catalog-view{display:none}
body[data-view="catalog"] .watch-view{display:none}

/* ================= CATALOG VIEW ================= */
.catalog-view{
  max-width:1360px;margin:0 auto;padding:20px 20px 96px;
  display:flex;flex-direction:column;gap:26px;
}

/* Frosted Glass Feature Panel (single GPU blur surface) */
.hero-card{
  display:grid;grid-template-columns:148px 1fr;gap:22px;align-items:center;
  padding:20px;border-radius:16px;
  background:var(--glass);
  backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);
  border:1px solid var(--line-strong);box-shadow:var(--specular),0 18px 40px rgba(0,0,0,.32);
}
.hero-card[hidden]{display:none}
.hero-poster{
  width:148px;height:auto;aspect-ratio:3/4;border-radius:10px;object-fit:cover;
  background:var(--bg-depth);border:1px solid var(--line-strong);display:block;
}
.hero-label{
  display:inline-block;margin-bottom:8px;padding:3px 9px;border-radius:6px;
  background:rgba(45,212,191,.14);border:1px solid rgba(45,212,191,.3);
  font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--teal);
}
.hero-info h1{
  font-family:var(--font-display);margin:0 0 8px;
  font-size:clamp(22px,3vw,32px);line-height:1.14;text-wrap:balance;
}
.hero-info p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.5;max-width:54ch;text-pretty:auto}
.hero-cta{
  min-height:42px;padding:0 20px;border-radius:11px;
  border:1px solid var(--line-accent);background:var(--glass-accent);
  box-shadow:var(--specular-accent),0 6px 18px rgba(0,0,0,.25);
  color:var(--accent-text);font-size:13px;font-weight:700;
  transition:background .15s,border-color .15s,transform .12s;
}
.hero-cta:hover{background:var(--glass-accent-hover);border-color:var(--accent)}
.hero-cta:active{transform:scale(.97)}

.section-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding-bottom:10px;border-bottom:1px solid var(--line);
}
.section-head h2{font-family:var(--font-display);margin:0;font-size:18px;font-weight:700}
.section-head span{font-family:var(--font-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Poster Grid with Deferred Off-Screen Rendering */
.catalog-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:18px 14px;
  margin-top:16px;
}
.drama-card{
  display:flex;flex-direction:column;gap:8px;padding:0;border:0;background:transparent;
  color:var(--text);text-align:left;
}
.drama-card:nth-child(n + 7){
  content-visibility:auto;contain-intrinsic-size:auto 245px;
}
.drama-card:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:10px}
.drama-thumb-box{
  position:relative;aspect-ratio:3/4;width:100%;border-radius:10px;overflow:hidden;
  background:var(--bg-depth);border:1px solid var(--line);
  transition:border-color .15s,transform .18s ease-out;
}
.drama-card:hover .drama-thumb-box{border-color:var(--line-strong);transform:translateY(-2px)}
.drama-card.active .drama-thumb-box{border-color:var(--accent);border-width:2px}
.drama-thumb-box img{width:100%;height:100%;object-fit:cover;display:block}
.drama-badge{
  position:absolute;top:7px;left:7px;z-index:2;display:none;
  padding:3px 8px;border-radius:7px;
  background:rgba(16,20,28,.84);border:1px solid var(--line-accent);
  color:var(--accent-text);font-family:var(--font-mono);font-size:10px;font-weight:700;text-transform:uppercase;
}
.drama-card.active .drama-badge{display:block}
.drama-meta{display:flex;flex-direction:column;gap:2px}
.drama-meta strong{
  font-size:13px;font-weight:600;line-height:1.32;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
}

.catalog-more{
  grid-column:1 / -1;justify-self:center;margin-top:8px;
  min-height:42px;padding:0 24px;border-radius:11px;
  border:1px solid var(--line-strong);background:var(--glass-btn);
  box-shadow:var(--specular),0 6px 18px rgba(0,0,0,.25);
  color:var(--text);font-size:13px;font-weight:600;transition:background .15s,border-color .15s,transform .12s;
}
.catalog-more:hover{border-color:var(--line-accent);background:var(--glass-btn-hover)}
.catalog-more:active{transform:scale(.97)}
.empty{grid-column:1 / -1;padding:32px 6px;color:var(--muted);font-size:14px}

/* Frosted Floating Bottom Continue Dock */
.mini-dock{
  position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:45;
  max-width:560px;margin:0 auto;padding:10px 12px;border-radius:14px;
  background:rgba(20,26,36,.84);
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid var(--line-strong);box-shadow:var(--specular),0 18px 40px rgba(0,0,0,.5);
}
.mini-dock[hidden]{display:none}
.mini-dock-inner{display:flex;align-items:center;gap:12px}
.mini-dock img{width:36px;height:48px;border-radius:7px;object-fit:cover;background:var(--bg-depth);border:1px solid var(--line);flex:none}
.mini-dock-info{min-width:0;flex:1}
.mini-dock-info strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-dock-info small{display:block;font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:2px}
.mini-dock-btn{
  min-height:36px;padding:0 14px;border-radius:9px;flex:none;
  border:1px solid var(--line-accent);background:var(--glass-accent);box-shadow:var(--specular-accent);
  color:var(--accent-text);font-size:12px;font-weight:700;transition:background .15s,transform .12s;
}
.mini-dock-btn:hover{background:var(--glass-accent-hover)}
.mini-dock-btn:active{transform:scale(.97)}

/* ================= WATCH VIEW ================= */
.watch-view{
  max-width:1360px;margin:0 auto;padding:16px 20px 64px;
  display:flex;flex-direction:column;gap:16px;
}
.watch-bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back-btn{
  min-height:38px;padding:0 13px;border-radius:10px;border:1px solid var(--line-strong);
  background:var(--glass-btn);box-shadow:var(--specular),0 4px 12px rgba(0,0,0,.22);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:var(--text);font-size:12px;font-weight:600;transition:background .15s,border-color .15s,transform .12s;
}
.back-btn:hover{border-color:var(--line-accent);background:var(--glass-btn-hover)}
.back-btn:active{transform:scale(.97)}
.watch-ep-pill{
  padding:6px 11px;border-radius:8px;background:var(--glass);border:1px solid var(--line-strong);
  box-shadow:var(--specular);font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--accent);
}

.watch-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
.player-col{min-width:0;display:flex;flex-direction:column;gap:14px}

.screen{
  position:relative;width:100%;height:min(70vh,630px);border-radius:14px;overflow:hidden;
  background:#040608;border:1px solid var(--line-strong);box-shadow:0 24px 56px rgba(0,0,0,.45);
}
video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.screen-message{
  position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;
  align-items:center;justify-content:center;text-align:center;padding:24px;
  background:rgba(11,14,19,.84);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  color:var(--text);font-size:14px;line-height:1.55;
}
.screen-message.hidden{display:none}
.screen-message button{
  min-height:40px;padding:0 20px;border-radius:10px;
  border:1px solid var(--line-accent);background:var(--glass-accent);
  box-shadow:var(--specular-accent),0 8px 20px rgba(0,0,0,.3);
  color:var(--accent-text);font-weight:700;transition:background .15s,transform .12s;
}
.screen-message button:hover{background:var(--glass-accent-hover)}
.screen-message button[hidden]{display:none}

.watch-controls{
  background:var(--glass);
  backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);
  border:1px solid var(--line-strong);border-radius:14px;padding:15px 17px;box-shadow:var(--specular);
  display:flex;flex-direction:column;gap:12px;
}
.watch-title-row h2{font-family:var(--font-display);margin:0 0 4px;font-size:clamp(20px,2.2vw,26px);line-height:1.18}
.watch-title-row p{margin:0;color:var(--muted);font-size:13px}

.transport{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.transport button,.transport select{
  min-height:38px;padding:0 13px;border-radius:10px;border:1px solid var(--line-strong);
  background:var(--glass-btn);box-shadow:var(--specular);
  color:var(--text);font-size:12px;font-weight:600;transition:background .15s,border-color .15s,transform .12s;
}
.transport select{max-width:155px;padding:0 10px}
.transport select option{background:#121721;color:var(--text)}
.transport button:hover:not(:disabled),.transport select:hover:not(:disabled){border-color:var(--line-accent);background:var(--glass-btn-hover)}
.transport button:active:not(:disabled){transform:scale(.97)}
.transport button:disabled{opacity:.35;cursor:default}

.episodes-box{
  background:var(--glass);
  backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);
  border:1px solid var(--line-strong);border-radius:16px;padding:16px;box-shadow:var(--specular);
  display:flex;flex-direction:column;gap:12px;max-height:calc(min(70vh,630px) + 120px);
}
.episodes-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.episodes-head h3{font-family:var(--font-display);margin:0;font-size:15px;font-weight:700}
.episodes-head span{font-family:var(--font-mono);font-size:11px;color:var(--teal);font-variant-numeric:tabular-nums}

.ep-ranges{display:flex;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.ep-ranges[hidden]{display:none}
.ep-range-btn{
  padding:3px 0;border:0;border-bottom:2px solid transparent;background:transparent;
  color:var(--muted);font-family:var(--font-mono);font-size:11px;font-weight:700;
}
.ep-range-btn:hover,.ep-range-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

.episodes{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;
  overflow-y:auto;padding-right:2px;align-content:start;
  scrollbar-color:var(--line-strong) transparent;
}
.ep{
  min-height:40px;border-radius:9px;border:1px solid var(--line);
  background:var(--glass-btn);box-shadow:var(--specular);
  color:var(--text);font-family:var(--font-mono);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
  display:grid;place-items:center;padding:4px;transition:border-color .15s,background .15s,transform .12s;
}
.ep:nth-child(n + 31){
  content-visibility:auto;contain-intrinsic-size:auto 40px;
}
.ep:hover{border-color:var(--line-strong);background:var(--glass-btn-hover)}
.ep:active{transform:scale(.96)}
.ep.active{
  background:var(--glass-accent);border-color:var(--line-accent);
  box-shadow:var(--specular-accent);color:var(--accent-text);
}

/* ================= MOBILE ================= */
@media(max-width:860px){
  .topbar-inner{
    padding:10px 14px 12px;gap:10px;
    grid-template-columns:1fr auto;
    grid-template-areas:"brand actions" "search search";
  }
  .brand{grid-area:brand}
  .brand-mark-box{width:28px;height:28px;border-radius:8px}
  .brand-name{font-size:16px}
  .top-actions{grid-area:actions}
  .sync-status{display:none}
  .stat-chip{font-size:10px;padding:4px 8px}
  .sync-btn{min-height:34px;padding:0 10px;font-size:11px}
  .search-wrap{grid-area:search;max-width:none}
  .search-wrap input{height:42px;font-size:16px}

  .catalog-view{padding:14px 14px 92px;gap:20px}
  .hero-card{grid-template-columns:108px 1fr;gap:14px;padding:14px;border-radius:14px}
  .hero-poster{width:108px;border-radius:8px}
  .hero-info h1{font-size:20px}
  .hero-info p{font-size:12px;margin-bottom:12px}
  .hero-cta{min-height:38px;padding:0 16px;font-size:12px}

  .catalog-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:15px 10px;margin-top:12px}
  .drama-card:nth-child(n + 10){content-visibility:auto;contain-intrinsic-size:auto 175px}
  .drama-card:hover .drama-thumb-box{transform:none}
  .drama-meta strong{font-size:12px;line-height:1.28}

  .watch-view{padding:12px 14px 44px;gap:12px}
  .watch-layout{grid-template-columns:1fr;gap:14px}
  .screen{height:min(64svh,520px);border-radius:14px}
  .watch-controls{padding:13px 14px}
  .transport button,.transport select{min-height:40px;font-size:12px}
  .transport select{max-width:130px}
  .episodes-box{padding:13px;max-height:none}
  .episodes{grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;max-height:265px}
  .ep{min-height:40px;font-size:12px}
}
@media(max-width:340px){
  .catalog-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(prefers-reduced-motion:reduce){
  .drama-thumb-box,.ep,.sync-btn,.hero-cta{transition:none}
}
</style>
</head>
<body data-view="catalog">
<!-- Inline SVG symbol sprite using Lucide geometry (0 blocking script, 0 DOM scan) -->
<svg hidden aria-hidden="true" width="0" height="0" style="display:none;position:absolute">
  <symbol id="ic-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
  <symbol id="ic-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="ic-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="ic-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
  <symbol id="ic-arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
  <symbol id="ic-chev-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="ic-chev-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="ic-rotate" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
  <symbol id="ic-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
</svg>

<header class="topbar">
  <div class="topbar-inner">
    <button class="brand" id="brandBtn" type="button" aria-label="Kembali ke katalog">
      <span class="brand-mark-box"><svg class="lucide"><use href="#ic-play"/></svg></span>
      <span>
        <span class="brand-name">PANZEK<span>.</span>PLAYER</span>
        <span class="brand-tag">Arsip Drama</span>
      </span>
    </button>

    <div class="search-wrap">
      <label for="searchInput">Cari judul drama</label>
      <span class="search-icon" aria-hidden="true"><svg class="lucide"><use href="#ic-search"/></svg></span>
      <input id="searchInput" type="search" placeholder="Cari judul drama..." autocomplete="off">
      <button class="search-clear" id="searchClearBtn" type="button" aria-label="Hapus pencarian" hidden><svg class="lucide"><use href="#ic-x"/></svg></button>
    </div>

    <div class="top-actions">
      <span class="stat-chip" id="catalogStats">...</span>
      <button class="sync-btn" id="updateBtn" type="button"><svg class="lucide"><use href="#ic-refresh"/></svg><span>Update</span></button>
      <span class="sync-status" id="updateStatus" role="status">1j</span>
    </div>
  </div>
</header>

<main class="catalog-view" id="catalogView">
  <section class="hero-card" id="heroCard" hidden>
    <img class="hero-poster" id="heroPoster" src="" alt="" width="300" height="400" decoding="async" fetchpriority="high" referrerpolicy="no-referrer">
    <div class="hero-info">
      <span class="hero-label">Sorotan</span>
      <h1 id="heroTitle">—</h1>
      <p>Seluruh episode tersedia untuk diputar langsung dengan pemulihan tautan otomatis dan subtitle.</p>
      <button class="hero-cta" id="heroPlayBtn" type="button"><svg class="lucide"><use href="#ic-play"/></svg><span>Putar Episode 1</span></button>
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2 id="catalogHeading">Katalog Drama</h2>
      <span id="catalogHint">Memuat daftar...</span>
    </div>
    <div class="catalog-grid" id="catalogList"></div>
  </section>

  <div class="mini-dock" id="miniDock" hidden>
    <div class="mini-dock-inner">
      <img id="miniPoster" src="" alt="" width="36" height="48" decoding="async" referrerpolicy="no-referrer">
      <div class="mini-dock-info">
        <strong id="miniTitle">—</strong>
        <small id="miniEp">Lanjutkan menonton</small>
      </div>
      <button class="mini-dock-btn" id="miniResumeBtn" type="button"><svg class="lucide"><use href="#ic-play"/></svg><span>Lanjut</span></button>
    </div>
  </div>
</main>

<section class="watch-view" id="watchView">
  <div class="watch-bar">
    <button class="back-btn" id="backBtn" type="button"><svg class="lucide"><use href="#ic-arrow-left"/></svg><span>Katalog</span></button>
    <span class="watch-ep-pill" id="episodeBadge">—</span>
  </div>

  <div class="watch-layout">
    <div class="player-col">
      <div class="screen" id="playerWrap">
        <video id="video" controls playsinline preload="metadata" width="720" height="1280"></video>
        <div class="screen-message" id="screenMessage" role="status">
          <span id="screenMessageText">Memuat episode...</span>
          <button id="retryBtn" type="button" hidden><svg class="lucide"><use href="#ic-rotate"/></svg><span>Coba lagi</span></button>
        </div>
      </div>

      <div class="watch-controls">
        <div class="watch-title-row">
          <div>
            <h2 id="dramaTitle">Pilih drama</h2>
            <p id="dramaSubtitle">Mengambil daftar episode...</p>
          </div>
        </div>
        <div class="transport">
          <select id="resSelect" aria-label="Pilih kualitas" hidden></select>
          <select id="subSelect" aria-label="Pilih subtitle" hidden></select>
          <button id="prevBtn" type="button" aria-label="Episode sebelumnya"><svg class="lucide"><use href="#ic-chev-left"/></svg><span>Sebelumnya</span></button>
          <button id="nextBtn" type="button" aria-label="Episode berikutnya"><span>Berikutnya</span><svg class="lucide"><use href="#ic-chev-right"/></svg></button>
        </div>
      </div>
    </div>

    <aside class="episodes-box">
      <div class="episodes-head">
        <h3>Daftar Episode</h3>
        <span id="episodeCount">0 ep</span>
      </div>
      <div class="ep-ranges" id="epRanges" hidden></div>
      <div class="episodes" id="epStrip"></div>
    </aside>
  </div>
</section>
</body>
</html>
