<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panzek Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
:root{
  --bg:#07090f;
  --bg-elev:#0f1420;
  --glass:rgba(18,24,38,.74);
  --glass-hover:rgba(28,37,58,.86);
  --line:rgba(226,234,248,.11);
  --line-strong:rgba(226,234,248,.2);
  --text:#f4f6fb;
  --muted:#9aa4b8;
  --accent:#ff4d5a;
  --accent-soft:rgba(255,77,90,.16);
  --gold:#f4c983;
  --gold-soft:rgba(244,201,131,.16);
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{
  background-image:
    radial-gradient(900px 460px at 15% -10%, rgba(255,77,90,.14), transparent 60%),
    radial-gradient(800px 420px at 90% 0%, rgba(56,118,255,.12), transparent 58%);
  background-attachment:fixed;
}
button,input,select{font:inherit}
button{cursor:pointer;touch-action:manipulation}

/* Topbar */
.navbar{
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  background:rgba(7,9,15,.82);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.navbar-inner{
  max-width:1380px;margin:0 auto;
  padding:14px 28px;
  display:grid;grid-template-columns:auto minmax(240px,460px) auto;
  align-items:center;gap:20px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-badge{
  width:36px;height:36px;border-radius:11px;flex:none;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#ff4d5a,#d92b4b);
  box-shadow:0 8px 24px rgba(255,77,90,.35);
  color:#fff;font-weight:900;font-size:15px;letter-spacing:-.04em;
}
.brand-text{min-width:0}
.brand-mark{font-size:18px;font-weight:800;letter-spacing:-.04em;line-height:1.1}
.brand-mark span{color:var(--accent)}
.brand-sub{display:block;margin-top:2px;font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}

.search-box{position:relative;width:100%}
.search-box label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.search-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--muted);pointer-events:none;font-size:14px;
}
.search-box input{
  width:100%;height:42px;padding:0 16px 0 38px;
  border:1px solid var(--line);border-radius:999px;outline:0;
  background:rgba(255,255,255,.05);color:var(--text);font-size:14px;
  transition:border-color .18s,background .18s,box-shadow .18s;
}
.search-box input::placeholder{color:#7f8aa1}
.search-box input:focus{
  border-color:rgba(255,77,90,.65);
  background:rgba(255,255,255,.08);
  box-shadow:0 0 0 3px rgba(255,77,90,.16);
}

.nav-actions{display:flex;align-items:center;gap:10px;justify-self:end}
.stat-pill{
  padding:7px 12px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;
}
.update-btn{
  min-height:38px;padding:0 14px;border-radius:999px;
  border:1px solid var(--line-strong);background:var(--glass);color:var(--text);
  font-size:12px;font-weight:600;white-space:nowrap;
  transition:border-color .18s,background .18s,transform .12s;
}
.update-btn:hover:not(:disabled){border-color:var(--accent);background:var(--glass-hover)}
.update-btn:active:not(:disabled){transform:scale(.97)}
.update-btn:disabled{opacity:.6;cursor:wait}
.update-status{color:var(--muted);font-size:11px;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}

/* Main Container */
.container{max-width:1380px;margin:0 auto;padding:26px 28px 72px;display:flex;flex-direction:column;gap:34px}
.container.searching .catalog-section{order:-1}

/* Theater Layout (Video + Episode Side Panel) */
.theater{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:22px;align-items:start}
.stage-col{min-width:0;display:flex;flex-direction:column;gap:14px}

.screen{
  position:relative;width:100%;height:min(70vh,620px);
  background:radial-gradient(circle at center,#121726 0%,#05070c 72%);
  border:1px solid var(--line);border-radius:20px;overflow:hidden;
  box-shadow:0 28px 70px rgba(0,0,0,.55);
}
video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.screen-message{
  position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;
  align-items:center;justify-content:center;text-align:center;padding:24px;
  background:linear-gradient(180deg,rgba(7,9,15,.58),rgba(7,9,15,.86));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:#eef2fb;font-size:14px;line-height:1.6;
}
.screen-message.hidden{display:none}
.screen-message button{
  min-height:42px;padding:0 22px;border:1px solid rgba(255,77,90,.65);
  border-radius:999px;background:var(--accent);color:#fff;font-weight:700;
  box-shadow:0 8px 24px rgba(255,77,90,.3);
}
.screen-message button[hidden]{display:none}

/* Glass Info & Transport Card */
.player-card{
  background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--line);border-radius:18px;padding:18px 20px;
  display:flex;flex-direction:column;gap:14px;
}
.drama-meta{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.drama-titles{min-width:0}
.eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px;
}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
h1{font-size:clamp(20px,2.2vw,28px);line-height:1.2;letter-spacing:-.03em;margin:0 0 4px}
.subhead{margin:0;color:var(--muted);font-size:13px}

.player-tools{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding-top:12px;border-top:1px solid var(--line);
}
.now-playing{display:flex;align-items:center;gap:10px;min-width:0}
.now-playing small{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.now-playing strong{
  padding:5px 11px;border-radius:999px;background:var(--accent-soft);
  border:1px solid rgba(255,77,90,.35);color:#ffd5d8;font-size:12px;font-weight:700;
}
.transport{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.transport button,.transport select{
  min-height:38px;border:1px solid var(--line-strong);background:rgba(255,255,255,.06);
  color:var(--text);border-radius:10px;padding:0 13px;font-size:12px;font-weight:600;
  transition:background .15s,border-color .15s,transform .12s;
}
.transport select{padding:0 10px;max-width:155px}
.transport select option{background:#111623;color:var(--text)}
.transport button:hover:not(:disabled),.transport select:hover:not(:disabled){background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
.transport button:active:not(:disabled){transform:scale(.97)}
.transport button:disabled{opacity:.38;cursor:default}

/* Right Episode Panel */
.episodes-panel{
  background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--line);border-radius:20px;padding:18px;
  display:flex;flex-direction:column;gap:12px;
  max-height:calc(min(70vh,620px) + 126px);
}
.episodes-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.episodes-head h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.02em}
.episodes-head span{
  padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.06);
  border:1px solid var(--line);font-size:11px;font-weight:600;color:var(--muted);
}
.ep-ranges{display:flex;gap:6px;flex-wrap:wrap}
.ep-ranges[hidden]{display:none}
.ep-range-btn{
  padding:5px 10px;border-radius:8px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--muted);font-size:11px;font-weight:600;
}
.ep-range-btn:hover,.ep-range-btn.active{border-color:var(--accent);color:var(--text);background:var(--accent-soft)}

.episodes{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;
  overflow-y:auto;padding-right:2px;align-content:start;
  scrollbar-color:rgba(255,255,255,.2) transparent;
}
.ep{
  min-height:44px;background:rgba(255,255,255,.04);
  border:1px solid var(--line);border-radius:10px;
  color:#dce2ef;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;
  transition:background .15s,border-color .15s,transform .12s;
}
.ep span{display:none}
.ep:hover{border-color:rgba(255,255,255,.34);background:rgba(255,255,255,.09)}
.ep.active{
  background:linear-gradient(135deg,rgba(255,77,90,.28),rgba(255,77,90,.12));
  border-color:var(--accent);color:#fff;
  box-shadow:0 0 0 1px rgba(255,77,90,.35);
}
.ep:disabled{opacity:.35;cursor:default}

/* Catalog Poster Grid */
.catalog-section{display:flex;flex-direction:column;gap:16px}
.catalog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.catalog-head h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em}
.catalog-head span{color:var(--muted);font-size:12px}

.catalog{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px;
}
.drama{
  position:relative;display:flex;flex-direction:column;text-align:left;padding:0;
  border:1px solid var(--line);border-radius:16px;overflow:hidden;
  background:var(--bg-elev);color:var(--text);
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.drama:hover,.drama:focus-visible{
  transform:translateY(-3px);border-color:rgba(255,255,255,.28);
  box-shadow:0 16px 36px rgba(0,0,0,.42);outline:0;
}
.drama.active{
  border-color:var(--accent);
  box-shadow:0 0 0 2px rgba(255,77,90,.28),0 18px 36px rgba(0,0,0,.5);
}
.drama-poster{position:relative;aspect-ratio:3/4;width:100%;overflow:hidden;background:#151b2a}
.drama img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.drama:hover img{transform:scale(1.04)}
.drama-poster::after{
  content:"";position:absolute;inset:auto 0 0 0;height:48%;
  background:linear-gradient(180deg,transparent,rgba(7,9,15,.92));pointer-events:none;
}
.drama-tag{
  position:absolute;top:10px;left:10px;z-index:2;
  padding:4px 9px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.04em;
  background:rgba(7,9,15,.72);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);color:#e9eef9;
  display:none;
}
.drama.active .drama-tag{display:inline-flex;background:var(--accent);border-color:transparent;color:#fff}
.drama-body{padding:12px 12px 14px;display:flex;flex-direction:column;gap:4px}
.drama strong{
  font-size:13px;font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
}
.drama small{color:var(--muted);font-size:11px}

.catalog-more{
  grid-column:1 / -1;justify-self:center;
  min-height:44px;padding:0 28px;border-radius:999px;
  border:1px solid var(--line-strong);background:var(--glass);color:var(--text);
  font-size:13px;font-weight:600;
}
.catalog-more:hover:not(:disabled){border-color:var(--accent);background:var(--glass-hover)}
.empty{grid-column:1 / -1;color:var(--muted);font-size:14px;padding:24px 6px}

/* Mobile Layout */
@media(max-width:960px){
  .navbar-inner{
    padding:12px 16px;gap:10px;
    grid-template-columns:1fr auto;
    grid-template-areas:"brand actions" "search search";
  }
  .brand{grid-area:brand}
  .brand-badge{width:32px;height:32px;font-size:13px;border-radius:9px}
  .brand-mark{font-size:16px}
  .brand-sub{font-size:10px}
  .nav-actions{grid-area:actions;gap:8px}
  .stat-pill,.update-status{display:none}
  .update-btn{min-height:36px;padding:0 12px;font-size:11px}
  .search-box{grid-area:search}
  .search-box input{height:44px;font-size:16px}

  .container{padding:14px 14px calc(44px + env(safe-area-inset-bottom));gap:20px}
  .theater{grid-template-columns:1fr;gap:14px}
  .screen{height:min(62svh,520px);border-radius:18px}
  .player-card{padding:14px 15px;border-radius:16px;gap:12px}
  .player-tools{gap:10px}
  .transport{width:100%;justify-content:flex-start}
  .transport button,.transport select{min-height:42px;padding:0 11px;font-size:12px}
  .transport select{max-width:130px}

  .episodes-panel{padding:14px;border-radius:16px;max-height:none}
  .episodes{grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;max-height:270px}
  .ep{min-height:44px;font-size:12px}

  /* On mobile, keep catalog compact as horizontal snap shelf when browsing, or 3-col grid */
  .catalog-section{order:-1}
  .catalog{
    display:flex;gap:11px;overflow-x:auto;padding-bottom:6px;
    scroll-snap-type:x proximity;scrollbar-width:none;
  }
  .catalog::-webkit-scrollbar{display:none}
  .drama{flex:none;width:112px;border-radius:13px;scroll-snap-align:start}
  .drama:hover{transform:none}
  .drama-body{padding:8px 8px 10px}
  .drama strong{font-size:11px;line-height:1.28}
  .drama small{display:none}
  .catalog-more{min-width:112px;min-height:148px;border-radius:13px;padding:0 14px;font-size:12px}
}
@media(prefers-reduced-motion:reduce){
  .drama,.drama img,.ep,.transport button,.update-btn{transition:none}
}
</style>
</head>
<body>
<header class="navbar">
  <div class="navbar-inner">
    <div class="brand">
      <div class="brand-badge">P</div>
      <div class="brand-text">
        <div class="brand-mark">PANZEK<span>.</span>PLAYER</div>
        <span class="brand-sub">Drama Streaming</span>
      </div>
    </div>

    <div class="search-box">
      <label for="searchInput">Cari judul drama</label>
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" placeholder="Cari drama..." autocomplete="off">
    </div>

    <div class="nav-actions">
      <span class="stat-pill" id="catalogStats">Memuat...</span>
      <button class="update-btn" id="updateBtn" type="button">Update katalog</button>
      <span class="update-status" id="updateStatus" role="status">Otomatis tiap jam</span>
    </div>
  </div>
</header>

<main class="container">
  <section class="theater">
    <div class="stage-col">
      <div class="screen" id="playerWrap">
        <video id="video" controls playsinline preload="metadata"></video>
        <div class="screen-message" id="screenMessage" role="status">
          <span id="screenMessageText">Memuat katalog...</span>
          <button id="retryBtn" type="button" hidden>Coba lagi</button>
        </div>
      </div>

      <div class="player-card">
        <div class="drama-meta">
          <div class="drama-titles">
            <p class="eyebrow">Sedang diputar</p>
            <h1 id="dramaTitle">Pilih drama</h1>
            <p class="subhead" id="dramaSubtitle">Pilih judul dari katalog untuk mulai menonton.</p>
          </div>
        </div>
        <div class="player-tools">
          <div class="now-playing">
            <small>Episode aktif</small>
            <strong id="episodeBadge">—</strong>
          </div>
          <div class="transport">
            <select id="resSelect" aria-label="Pilih kualitas" hidden></select>
            <select id="subSelect" aria-label="Pilih subtitle" hidden></select>
            <button id="prevBtn" type="button" aria-label="Episode sebelumnya">← Sebelumnya</button>
            <button id="nextBtn" type="button" aria-label="Episode berikutnya">Berikutnya →</button>
          </div>
        </div>
      </div>
    </div>

    <aside class="episodes-panel">
      <div class="episodes-head">
        <h2>Daftar episode</h2>
        <span id="episodeCount">0 episode</span>
      </div>
      <div class="ep-ranges" id="epRanges" hidden></div>
      <div class="episodes" id="epStrip"></div>
    </aside>
  </section>

  <section class="catalog-section">
    <div class="catalog-head">
      <h2 id="catalogHeading">Jelajahi drama</h2>
      <span id="catalogHint">Pilih poster drama untuk memutar</span>
    </div>
    <div class="catalog" id="catalogList"></div>
  </section>
</main>

<script src="app.js?v=10"></script>
</body>
</html>
